<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rodab Medical - International Hospital providing quality healthcare, emergency ambulance dispatch, and first-class medical attention" />
    <meta name="theme-color" content="#00193a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rodab Medical - International Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cemaqackwtqkkqxlkttn.supabase.co" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    </noscript>
    <style>
      body { margin: 0; background: #f8fafc; color: #0f172a; font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .rb-shell-bar { height: 52px; background: #12175c; color: #fff; display: flex; align-items: center; padding: 0 24px; font-size: 13px; }
      .rb-shell-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; min-height: 44px; }
      .rb-shell-brand img { height: 30px; width: auto; }
      .rb-shell-brand b { display: block; font-size: 15px; font-weight: 700; line-height: 1.15; }
      .rb-shell-brand small { display: block; font-size: 11px; opacity: 0.75; }
      .rb-shell-hero { position: relative; height: clamp(400px, 60vw, 600px); background: linear-gradient(115deg, #12175c 0%, #0b2a57 48%, #111827 100%); display: flex; align-items: center; overflow: hidden; }
      .rb-shell-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .rb-shell-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 100%); }
      .rb-shell-hero-inner { position: relative; max-width: 640px; margin: 0 8%; padding: 0 16px; color: #fff; }
      .rb-shell-hero h1 { font-size: clamp(1.5rem, 4vw, 3rem); font-weight: 800; margin: 0 0 16px; line-height: 1.1; color: #fff; }
      .rb-shell-hero p { font-size: clamp(0.9rem, 2vw, 1.25rem); margin: 0 0 32px; line-height: 1.6; opacity: 0.9; }
      .rb-shell-cta { display: inline-block; padding: 14px 32px; background: #dc2626; color: #fff; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
      #rb-shell, #rb-spinner { animation: rb-fadein 0.3s ease-in; }
      @keyframes rb-fadein { from { opacity: 0.001; } to { opacity: 1; } }
      .rb-spinner-wrap { min-height: 72vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f8fafc; color: #12175c; }
      .rb-spinner { width: 40px; height: 40px; border: 3.5px solid #cbd5e1; border-top-color: #12175c; border-radius: 50%; animation: rb-spin 0.7s linear infinite; }
      .rb-spinner-wrap b { font-size: 15px; font-weight: 600; }
      @keyframes rb-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="rb-shell">
        <div class="rb-shell-bar">
          <a class="rb-shell-brand" href="/" aria-label="Rodab Medical - Home">
            <img src="/favicon.svg" width="30" height="30" alt="" />
            <span><b>Rodab Medical</b><small>Healthcare Services</small></span>
          </a>
        </div>
        <div class="rb-shell-hero">
          <img class="rb-shell-hero-img" src="https://cemaqackwtqkkqxlkttn.supabase.co/storage/v1/object/public/images/Hero%20Image%205.avif" alt="" loading="lazy" decoding="async" />
          <div class="rb-shell-hero-overlay"></div>
          <div class="rb-shell-hero-inner">
            <h1>Compassionate Healthcare</h1>
            <p>Advanced medical care delivered with compassion and excellence by our world-class specialists.</p>
            <a class="rb-shell-cta" href="/services">Our Services</a>
          </div>
        </div>
      </div>
      <div id="rb-spinner">
        <div class="rb-spinner-wrap">
          <div class="rb-spinner"></div>
          <b>Rodab Medical</b>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var p = location.pathname;
        var landing = p === '/' || p === '/services' || p === '/find-doctor' || p === '/about-us' || p === '/events' || p === '/faqs' || p === '/privacy-policy' || p === '/policies' || p === '/sos';
        document.getElementById('rb-shell').style.display = landing ? '' : 'none';
        document.getElementById('rb-spinner').style.display = landing ? 'none' : '';
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
